services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_band
      POSTGRES_PASSWORD: agent_band
      POSTGRES_DB: agent_band
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent_band -d agent_band']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
