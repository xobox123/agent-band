name: Format Vector Knowledge Proposal
on:
  push:
    branches:
      - chatgpt/vector-knowledge-design-20261012
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and print encoded document
        run: |
          npx prettier --write docs/superpowers/specs/2026-10-12-vector-knowledge.md
          echo BEGIN_FORMATTED_VECTOR_DOC
          base64 -w0 docs/superpowers/specs/2026-10-12-vector-knowledge.md
          echo
          echo END_FORMATTED_VECTOR_DOC
